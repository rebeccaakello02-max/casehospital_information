<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Hospital | Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-hospital-alt me-2"></i>Case Hospital</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="staff.html">Our Staff</a></li>
                    <li class="nav-item"><a class="nav-link" href="appointment.html">Appointment</a></li>
                    <li class="nav-item"><a class="nav-link" href="ratings.html">Ratings</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-medical btn-sm px-3 ms-lg-2" href="login.html">Log In</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="bg-light-blue py-5 text-center">
            <div class="container">
                <h1 class="fw-bold text-primary">Schedule an Appointment</h1>
                <p class="text-muted mb-0">Fill out the form below to reserve your consultation time.</p>
            </div>
        </section>

        <section class="py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-7">
                        <div class="card card-medical p-4 p-md-5">
                            <form id="appointmentForm">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Full Name</label>
                                        <input type="text" id="patientName" class="form-control" placeholder="e.g., Jane Doe" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Phone Number</label>
                                        <input type="tel" class="form-control" placeholder="+256 7XX XXX XXX" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Email Address</label>
                                        <input type="email" class="form-control" placeholder="patient@example.com" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Preferred Date</label>
                                        <input type="date" id="appointmentDate" class="form-control" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Select Specialist / Doctor</label>
                                        <select id="doctorSelect" class="form-select" required>
                                            <option value="">-- Choose a Doctor --</option>
                                            <option value="Dr. Samuel Mukasa">Dr. Samuel Mukasa (Cardiology)</option>
                                            <option value="Dr. Grace Namukasa">Dr. Grace Namukasa (Pediatrics)</option>
                                            <option value="Dr. David Ochieng">Dr. David Ochieng (Orthopedics)</option>
                                            <option value="Dr. Sarah Nantongo">Dr. Sarah Nantongo (Maternity)</option>
                                        </select>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Symptoms or Reason for Visit</label>
                                        <textarea class="form-control" rows="3" placeholder="Briefly describe your medical concern..."></textarea>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-medical w-100 py-2 fw-semibold">Confirm Appointment</button>
                                    </div>
                                </div>
                            </form>
                            <div id="appointmentAlert"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1 fw-bold text-primary">Case Hospital Medical Center</p>
            <p class="small text-muted mb-0">&copy; 2026 Case Hospital. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
