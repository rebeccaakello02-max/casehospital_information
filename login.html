<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Hospital | Portal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-hospital-alt me-2"></i>Case Hospital</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="staff.html">Our Staff</a></li>
                    <li class="nav-item"><a class="nav-link" href="appointment.html">Appointment</a></li>
                    <li class="nav-item"><a class="nav-link" href="ratings.html">Ratings</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="btn btn-medical btn-sm px-3 ms-lg-2" href="login.html">Log In</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="d-flex align-items-center py-5 bg-lighter-blue">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="card card-medical p-4 p-md-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-shield fa-3x text-primary mb-2"></i>
                            <h3 class="fw-bold text-primary">Hospital Portal Login</h3>
                            <p class="small text-muted">Access lab records, prescriptions, or staff schedules</p>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Login As</label>
                                <select id="userRole" class="form-select">
                                    <option value="Patient">Patient</option>
                                    <option value="Medical Staff">Medical Staff / Doctor</option>
                                    <option value="Administrator">Hospital Administrator</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Email or Hospital ID</label>
                                <input type="email" id="loginEmail" class="form-control" placeholder="name@casehospital.org" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <input type="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label small" for="rememberMe">Remember me</label>
                                </div>
                                <a href="contact.html" class="small text-primary text-decoration-none">Need help?</a>
                            </div>
                            <button type="submit" class="btn btn-medical w-100 py-2 fw-semibold">Sign In</button>
                        </form>
                        <div id="loginAlert"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-1 fw-bold text-primary">Case Hospital Medical Center</p>
            <p class="small text-muted mb-0">&copy; 2026 Case Hospital. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
